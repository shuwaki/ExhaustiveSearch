name: CI

on:
  push:
    branches: [master, main, work]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ExhaustiveSearch.sln

      - name: Build
        run: dotnet build ExhaustiveSearch.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ExhaustiveSearch.sln --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Pack
        run: dotnet pack src/ExhaustiveSearch/ExhaustiveSearch.csproj --configuration Release --no-build --output artifacts

      - name: Inspect package contents
        run: |
          unzip -l artifacts/ExhaustiveSearch.*.nupkg
          test -f artifacts/ExhaustiveSearch.*.snupkg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.*nupkg
          if-no-files-found: error
